# Squeeze holds ctrl+opt+F12 (Wispr's push-to-talk) via ~/.local/bin/tinghold,
# which presses real modifier keys. tingle does not dictate.
# Bottom button (tingle: white) = Enter, middle (green) = cmd+Z. Top (orange) = effects only.
# Undo: delete this file.
[mappings]
triggerDown = { type = "shell", command = "$HOME/.local/bin/tinghold down" }
triggerUp = { type = "shell", command = "$HOME/.local/bin/tinghold up" }
fxChange = { type = "shell", command = "true" }
modeChange = { type = "shell", command = "$HOME/.local/bin/tinghold undo" }
white = { type = "keystroke", key = "return" }
